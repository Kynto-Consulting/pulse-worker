name = "websockets"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

# Bind our Durable Object
[[durable_objects.bindings]]
name = "PULSE_DO"
class_name = "PulseBroker"

# Apply migrations when adding a new DO class
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PulseBroker"]

# Secrets: PULSE_SECRET and PULSE_BROADCAST_SECRET are set via `wrangler secret put`
